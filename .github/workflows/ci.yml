name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Dependency boundaries
        run: pnpm depcruise

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        run: pnpm check:bundles

      - name: Secret scan
        run: pnpm check:secrets

      # The Postgres service container and database integration tests arrive
      # with migration 0001 in Milestone 5 (items, containers, ledger).
